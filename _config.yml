# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language and timezone
lang: en
timezone: Asia/Seoul

# jekyll-seo-tag settings
title: DeepThinkJo
tagline: Exploring the world of machine learning
description: >-
  A personal blog exploring the mathematical foundations, theories, and practical applications of Artificial Intelligence and Machine Learning.

url: 'https://DeepThinkJo.github.io'

github:
  username: DeepThinkJo
twitter:
  username: DeepThinkJo

social:
  name: Seunghwan Jo
  email: deepthinkjo@gmail.com
  fediverse_handle:
  links:
    - https://twitter.com/DeepThinkJo
    - https://github.com/DeepThinkJo
    - https://www.linkedin.com/in/deepthinkjo

# Site Verification Settings
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# Web Analytics Settings
analytics:
  google:
    id: G-0BKZT6BJKQ
  goatcounter:
    id: # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Page views settings
pageviews:
  provider:

# Theme preference
theme_mode: # [light | dark]

# CDN
cdn:

# Sidebar avatar
avatar:

# Social preview image
social_preview_image:

# Table of Contents
toc: true

# Post actions
actions:
  edit_post:
    enabled: true
    url: "https://github.com/DeepThinkJo/DeepThinkJo.github.io/edit/main"
    static_url: false

# Comments
comments:
  provider: giscus

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo: "DeepThinkJo/DeepThinkJo.github.io"
    repo_id: "R_kgDOUP3x9A"
    category: "General"
    category_id: "DIC_kwDOUP3x9M4DKfza"
    mapping: "pathname"
    strict: "0"
    input_position: "bottom"
    lang: "en"
    reactions_enabled: "1"

# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# Base URL
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
